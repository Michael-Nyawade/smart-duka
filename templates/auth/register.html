{% extends "base.html" %} {% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="site-brand-mark">S</span>
      <span>SmartDuka</span>
    </div>

    <h2 class="auth-title">Create your shop account</h2>
    <p class="auth-subtitle">Set up SmartDuka for your shop in a minute.</p>

    <form method="POST">
      {% csrf_token %} {{ form.as_p }}

      <button type="submit" class="btn btn-primary w-100">
        Create account
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="{% url 'pos_login' %}">Log in</a>
    </p>
  </div>
</div>

{% endblock %}
