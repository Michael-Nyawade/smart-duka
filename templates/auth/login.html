{% extends "base.html" %} {% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="site-brand-mark">S</span>
      <span>SmartDuka</span>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Log in to manage your shop.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label for="id_username">Username</label>
        <input
          type="text"
          name="username"
          id="id_username"
          class="form-control"
          placeholder="e.g. shopowner"
          required
          autofocus
        />
      </div>

      <div class="mb-3">
        <label for="id_password">Password</label>
        <input
          type="password"
          name="password"
          id="id_password"
          class="form-control"
          placeholder="Your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="auth-footer">
      Don't have a shop account yet?
      <a href="{% url 'register' %}">Create one</a>
    </p>
  </div>
</div>

{% endblock %}
