{% extends "base.html" %} {% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="site-brand-mark">S</span>
      <span>SmartDuka</span>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Log in to manage your shop.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3">
        <label for="id_username">
          Username <span class="required-mark">*</span>
        </label>
        <input
          type="text"
          name="username"
          id="id_username"
          class="form-control"
          placeholder="e.g. shopowner"
          required
          autofocus
        />
      </div>

      <div class="mb-3">
        <label for="id_password">
          Password <span class="required-mark">*</span>
        </label>
        <div class="password-field">
          <input
            type="password"
            name="password"
            id="id_password"
            class="form-control"
            placeholder="Your password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Show password"
            onclick="toggleReveal(this)"
          >
            <svg
              class="icon-eye"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg
              class="icon-eye-off"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="display: none"
            >
              <path
                d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a21.8 21.8 0 0 1 5.17-6.11M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.8 21.8 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
              />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="auth-footer">
      Don't have a shop account yet?
      <a href="{% url 'register' %}">Create one</a>
    </p>
  </div>
</div>

{% endblock %}
