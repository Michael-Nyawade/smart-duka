{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">

        <div class="card mt-5">
            <h2 class="mb-4">SmartDuka Login</h2>

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Username"
                        required
                    >
                </div>

                <div class="mb-3">
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Login
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
