<h1>SmartDuka POS</h1>

<form method="post">
    {% csrf_token %}

    <label>Product:</label>
    <select name="product">
        <option value="">-- select product --</option>
        {% for product in products %}
            <option value="{{ product.id }}">
                {{ product.name }} (Stock: {{ product.stock_quantity }})
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Quantity:</label>
    <input type="number" name="quantity" value="1">

    <br><br>

    <button type="submit">Add to Cart</button>
</form>

<hr>

<h3>Cart</h3>

{% if cart %}
    <table border="1" cellpadding="5">
        <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

        {% for key, item in cart.items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.qty }}</td>
            <td>{{ item.price }}</td>
            <td>{{ item.qty|floatformat:2|add:"0" }}</td>
        </tr>
        {% endfor %}
    </table>

    <h4>Total: {{ total }}</h4>

    <br>
    <a href="{% url 'checkout' %}">
        <button>Checkout</button>
    </a>
{% else %}
    <p>Cart is empty</p>
{% endif %}
