<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>POS</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div style="
    display: grid;
    grid-template-columns: 2fr 1fr;
    height: 100vh;
    font-family: Arial;
">

    <!-- LEFT: PRODUCTS -->
    <div style="padding: 15px; overflow-y: auto; border-right: 2px solid #ddd;">
        <h2>Products</h2>

        <!-- FAST SEARCH -->
        <input
            id="pos-search"
            type="text"
            class="form-control"
            placeholder="Search product... "
            autofocus
        />
        <div id="suggestions" class="list-group mt-2"></div>

        <div
            id="product-list"
            hx-get="/pos/products/partial/"
            hx-trigger="load, every 5s"
            hx-swap="innerHTML"
        >
            Loading products...
        </div>
    </div>

    <!-- RIGHT: CART -->
    <div style="padding: 15px; background: #f9f9f9; display: flex; flex-direction: column;">

        <div id="cart-container">
            {% include "pos/cart_partial.html" %}
        </div>
    </div>

</div>

<script>
function updateCart(productId, action) {
    fetch("{% url 'api_update_cart' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "product_id=" + productId + "&action=" + action
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("cart-container").innerHTML = data.cart_html;
        document.getElementById("total").innerText = data.total;
    });
}


// FAST ADD (grid products)
function addToCart(productId) {
    fetch("{% url 'api_add_to_cart' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "product_id=" + productId
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("cart-container").innerHTML = data.cart_html;
        document.getElementById("total").innerText = data.total;
    });
}


// Keyboard shortcuts
document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() === "c") {
        window.location.href = "{% url 'checkout' %}";
    }
    if (e.key.toLowerCase() === "x") {
        window.location.href = "{% url 'clear_cart' %}";
    }
});


// POS SEARCH
const searchInput = document.getElementById("pos-search");
const suggestions = document.getElementById("suggestions");

let selectedIndex = -1;
let currentResults = [];

searchInput.addEventListener("input", async function () {
    const q = this.value;

    if (q.length < 1) {
        suggestions.innerHTML = "";
        return;
    }

    const res = await fetch(`/pos/search/?q=${q}`);
    currentResults = await res.json();

    renderSuggestions();
});

function renderSuggestions() {
    suggestions.innerHTML = "";

    currentResults.forEach((item, index) => {
        const div = document.createElement("div");

        div.className = "list-group-item list-group-item-action";
        div.innerHTML = `${item.name} - ${item.price} (Stock: ${item.stock})`;

        if (index === selectedIndex) {
            div.classList.add("active");
        }

        div.onclick = () => addToCart(item.id);

        suggestions.appendChild(div);
    });
}

searchInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") {
        selectedIndex = Math.min(selectedIndex + 1, currentResults.length - 1);
        renderSuggestions();
    }

    if (e.key === "ArrowUp") {
        selectedIndex = Math.max(selectedIndex - 1, 0);
        renderSuggestions();
    }

    if (e.key === "Enter") {
        if (currentResults[selectedIndex]) {
            addToCart(currentResults[selectedIndex].id);
        }
    }
});
</script>

<script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>
