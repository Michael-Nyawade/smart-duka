<body>
<div style="
    display: grid;
    grid-template-columns: 2fr 1fr;
    height: 100vh;
    font-family: Arial;
">

    <!-- LEFT: PRODUCTS -->
    <div style="padding: 15px; overflow-y: auto; border-right: 2px solid #ddd;">
        <h2>Products</h2>

        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">

            {% for product in products %}
                <div onclick="addToCart('{{ product.id }}')" style="
                    border: 1px solid #ddd;
                    padding: 10px;
                    cursor: pointer;
                ">
                    <h4>{{ product.name }}</h4>
                    <p>Stock: {{ product.stock_quantity }}</p>
                    <p>Selling Price: {{ product.selling_price }}</p>
                </div>
            {% endfor %}

        </div>
    </div>

    <!-- RIGHT: CART -->
    <div style="padding: 15px; background: #f9f9f9; display: flex; flex-direction: column;">
        <h2>Cart</h2>

        <div id="cart-container">
            {% include "pos/cart_partial.html" %}
        </div>
    </div>

</div>

<script>
function updateCart(productId, action) {
    fetch("{% url 'api_update_cart' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "product_id=" + productId + "&action=" + action
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("cart-container").innerHTML = data.cart_html;
        document.getElementById("total").innerText = data.total;
    });
}


// FAST ADD (grid products)
function addToCart(productId) {
    fetch("{% url 'api_add_to_cart' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: "product_id=" + productId
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("cart-container").innerHTML = data.cart_html;
        document.getElementById("total").innerText = data.total;
    });
}


// Keyboard shortcuts
document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() === "c") {
        window.location.href = "{% url 'checkout' %}";
    }
    if (e.key.toLowerCase() === "x") {
        window.location.href = "{% url 'clear_cart' %}";
    }
});
</script>
</body>
