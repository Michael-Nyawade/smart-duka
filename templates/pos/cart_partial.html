<h3>Cart</h3>

{% if cart %}

<table style="width: 100%;">
    <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Action</th>
    </tr>

    {% for key, item in cart.items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.qty }}</td>
        <td>
            <button onclick="updateCart('{{ key }}', 'decrease')">➖</button>
            <button onclick="updateCart('{{ key }}', 'increase')">➕</button>
        </td>
    </tr>
    {% endfor %}

</table>

<h2>Total: <span id="total">{{ total }}</span></h2>

<a href="{% url 'checkout' %}">
    <button style="width: 100%;">Checkout (C)</button>
</a>

<a href="{% url 'clear_cart' %}">
    <button style="width: 100%;">Clear (X)</button>
</a>

{% else %}
<p>Cart is empty</p>
{% endif %}
