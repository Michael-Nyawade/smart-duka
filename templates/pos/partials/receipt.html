<div class="pos-receipt-panel">
  <div class="pos-receipt-icon">✓</div>

  <h2>Sale Completed</h2>

  <p>
    Receipt: <span class="pos-receipt-number">{{ sale.receipt_number }}</span>
  </p>
  <p>Total: <strong>KES {{ sale.total_amount }}</strong></p>

  <a href="{% url 'pos_home' %}" class="btn btn-primary w-100 mt-2">
    New Sale
  </a>
</div>

<!-- Out-of-band swap: refresh the cart panel to empty now that the sale is complete -->
<div id="cart-box" hx-swap-oob="true">
  {% include "pos/partials/cart.html" %}
</div>
