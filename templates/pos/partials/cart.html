<h3>Cart</h3>

{% if cart %}

<table width="100%">
    <tr>
        <th>Item</th>
        <th>Qty</th>
    </tr>

    {% for key, item in cart.items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.qty }}</td>
    </tr>
    {% endfor %}
</table>
<div id="cart-total-wrapper">
    <h4>Total: KES {{ total }}</h4>
</div>

{% else %}
<p>Cart is empty</p>
{% endif %}
