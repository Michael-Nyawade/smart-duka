<div class="pos-checkout-panel">

    <h2>Checkout</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form
        hx-post="{% url 'htmx_process_checkout' %}"
        hx-target="#checkout-box"
        hx-swap="innerHTML"
    >
        {% csrf_token %}

        <div class="pos-cart-total">
            <span>Total</span>
            <span>KES {{ total }}</span>
        </div>

        <div class="mb-3">
            <label for="checkout-customer">
                Customer <span class="required-mark" id="customer-required-mark" style="display: none;">*</span>
            </label>
            <select name="customer" id="checkout-customer" class="form-select">
                <option value="" id="customer-empty-option">Walk-in</option>
                {% for c in customers %}
                    <option value="{{ c.id }}" {% if selected_customer == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
            <div class="helptext" id="customer-credit-hint" style="display: none;">
                A customer is required for credit sales.
                Not listed? <a href="{% url 'customer_create' %}" target="_blank" rel="noopener">Add a customer</a> in a new tab, then click Checkout again.
            </div>
        </div>

        <div class="mb-3">
            <label for="checkout-payment-method">Payment Method</label>
            <select name="payment_method" id="checkout-payment-method" class="form-select" onchange="syncCreditFields()">
                <option value="CASH" {% if selected_payment_method == "CASH" or not selected_payment_method %}selected{% endif %}>Cash</option>
                <option value="MOBILE" {% if selected_payment_method == "MOBILE" %}selected{% endif %}>Mobile Money</option>
                <option value="CREDIT" {% if selected_payment_method == "CREDIT" %}selected{% endif %}>Credit</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Complete Sale
        </button>
    </form>

</div>

<script>
function syncCreditFields() {
    var isCredit = document.getElementById("checkout-payment-method").value === "CREDIT";

    document.getElementById("checkout-customer").required = isCredit;
    document.getElementById("customer-empty-option").textContent = isCredit ? "Select a customer…" : "Walk-in";
    document.getElementById("customer-required-mark").style.display = isCredit ? "" : "none";
    document.getElementById("customer-credit-hint").style.display = isCredit ? "block" : "none";
}

syncCreditFields();
</script>
