<!DOCTYPE html>
<html>
<head>
    <title>SmartDuka</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            margin: auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .stat {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        h1, h2 {
            margin-top: 0;
        }
    </style>

    <!-- HTMX script -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>

<body>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
